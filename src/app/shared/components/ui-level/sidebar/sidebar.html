<div class="sidebar">

  <div class="sidebar-header">
    <span class="sidebar-role">{{ role }}</span>
  </div>

  <nav class="sidebar-nav">
    <a
      *ngFor="let link of links"
      [routerLink]="link.route"
      routerLinkActive="active"
      class="sidebar-link">
      {{ link.label }}
    </a>
  </nav>

</div>
